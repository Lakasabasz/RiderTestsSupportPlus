- pipeline: Build
  events:
  - type: PUSH
    refs:
    - refs/heads/*
  actions:
  - action: Build plugin
    type: BUILD
    commands: |-
      set -eu
      BASE_VERSION=$(sed -n 's/^PluginVersion=//p' gradle.properties)
      # master: <PluginVersion>.<run id>, e.g. 0.3.0.57, the Release pipeline looks for it;
      # other branches: <PluginVersion>-<branch>.<run id>, never mistaken for a release
      if [ "$BUDDY_RUN_BRANCH" = master ]; then
        VERSION="$BASE_VERSION.$BUDDY_RUN_ID"
      else
        BRANCH_ID=$(printf '%s' "$BUDDY_RUN_BRANCH" | tr -c 'A-Za-z0-9' '-')
        VERSION="$BASE_VERSION-$BRANCH_ID.$BUDDY_RUN_ID"
      fi
      echo "Building $VERSION"
      # The pipeline filesystem is kept between runs, don't publish zips of earlier runs
      rm -rf output
      ./gradlew buildPlugin -PPluginVersion="$VERSION" --no-daemon --console=plain
      ls -la output
      echo "PLUGIN_VERSION=$VERSION" >> "$BUDDY_VAR"
      echo "PLUGIN_BASE_VERSION=$BASE_VERSION" >> "$BUDDY_VAR"
    cached_dirs:
    - /root/.gradle
    - /root/.local/share/gradle-jvm
    - /root/.nuget/packages
    shell: BASH
    docker_image_name: lakasabasz/build-image
    docker_image_tag: latest
    image_location: PUBLIC_REGISTRY
    docker_registry: OTHER
    registry: container.eu.registry.sh
  - action: Publish artifact version
    type: PUBLISH_ARTIFACT_VERSION
    local_path: /output
    deployment_includes:
    - '*.zip'
    - '*.nupkg'
    input_type: BUILD_ARTIFACTS
    versions:
    - $PLUGIN_VERSION
    artifact: ridertestssupportplus-artifacts
  # Master builds also as <PluginVersion> (e.g. 0.3.0): the Release pipeline downloads that version
  # right after its release commit, the latest master build of a version overwrites it
  - action: Publish release version
    type: PUBLISH_ARTIFACT_VERSION
    local_path: /output
    deployment_includes:
    - '*.zip'
    - '*.nupkg'
    input_type: BUILD_ARTIFACTS
    versions:
    - $PLUGIN_BASE_VERSION
    artifact: ridertestssupportplus-artifacts
    trigger_conditions:
    - trigger_condition: VAR_IS
      trigger_variable_key: BUDDY_RUN_BRANCH
      trigger_variable_value: master
