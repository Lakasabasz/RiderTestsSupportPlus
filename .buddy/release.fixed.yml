# Manual release from master:
#   1. asks for the version increment and the changes,
#   2. validates them (at least one change),
#   3. adds the version to CHANGELOG.md and gradle.properties, a Git Push action commits them to master,
#      which triggers the Build and Mirror do GH pipelines,
#   4. waits for the Build pipeline's artifact version <version> (its master builds publish it too),
#   5. creates the GitHub release v<version> with the zip and nupkg.
# Needs a GitHub integration with access to Lakasabasz/RiderTestsSupportPlus (name in "integration" below)
- pipeline: "Release"
  # No events: runs only when started manually, and only from master
  refs:
    - "refs/heads/master"
  actions:
    - action: "Release details"
      type: "WAIT_FOR_VARIABLES"
      comment: "Version increment and changes, one per line. Fill in at least one of the changes. None: release the newest CHANGELOG.md version again (after a failed release), changes are ignored."
      # TODO: confirm with the YAML exported from the GUI: INCREMENT a drop-down (Patch first, so it's the default),
      # the three changes multi-line text inputs
      variables:
        - key: "INCREMENT"
          type: "VAR"
          defaults: "Patch\nMinor\nMajor\nNone"
        - key: "NEW_FEATURES"
          type: "VAR"
          defaults: ""
        - key: "IMPROVEMENTS"
          type: "VAR"
          defaults: ""
        - key: "BUGS"
          type: "VAR"
          defaults: ""

    - action: "Validate"
      type: "BUILD"
      # Only edits files, no need for the build image
      image_location: "PUBLIC_REGISTRY"
      docker_registry: "DOCKER_HUB"
      docker_image_name: "library/python"
      docker_image_tag: "3.13-slim"
      shell: "BASH"
      commands: |-
        python3 ci/release.py check

    - action: "Update CHANGELOG.md"
      type: "BUILD"
      # Only edits files, no need for the build image
      image_location: "PUBLIC_REGISTRY"
      docker_registry: "DOCKER_HUB"
      docker_image_name: "library/python"
      docker_image_tag: "3.13-slim"
      shell: "BASH"
      commands: |-
        # Assets downloaded by an earlier run must not get into the release commit (also in .gitignore)
        rm -rf release
        # Also passes RELEASE_VERSION and RELEASE_NOTES (one line of HTML) to the next actions
        python3 ci/release.py update

    - action: "Push release commit"
      type: "PUSH"
      # Commits CHANGELOG.md and gradle.properties from the pipeline filesystem; the push triggers
      # the Build and Mirror do GH pipelines
      comment: "Release $RELEASE_VERSION"
      target_branch: "master"
      # No force: fails if master moved since this run started
      without_force: true
      # INCREMENT None changes nothing, there is nothing to push
      trigger_conditions:
        - trigger_condition: "VAR_IS_NOT"
          trigger_variable_key: "INCREMENT"
          trigger_variable_value: "None"
      # TODO: the project's own repository as the target (set it up in the GUI, no authorization needed)
      targets:
        - "project_repository"

    - action: "Download the artifact"
      type: "DOWNLOAD_ARTIFACT_VERSION"
      artifact: "ridertestssupportplus-artifacts"
      # Master builds publish <PluginVersion> as well; it appears once the Build pipeline started by the
      # release commit is done
      version: "$RELEASE_VERSION"
      destination_path: "/release"
      retry_count: 5
      retry_interval: 240

    - action: "Check the artifact"
      type: "BUILD"
      image_location: "PUBLIC_REGISTRY"
      docker_registry: "DOCKER_HUB"
      docker_image_name: "library/python"
      docker_image_tag: "3.13-slim"
      shell: "BASH"
      commands: |-
        # Also passes ARTIFACT_VERSION (e.g. 0.3.0.57, in the file names) to the next actions
        python3 ci/release.py check-artifact

    - action: "GitHub release"
      type: "GIT_HUB_RELEASE"
      # TODO: name of the GitHub integration in Buddy
      integration: "github"
      organization: "Lakasabasz"
      repository: "RiderTestsSupportPlus"
      tag_name: "v$RELEASE_VERSION"
      # The release commit, unless master moved on while waiting for the artifact
      target_commitish: "master"
      release_name: "$RELEASE_VERSION"
      body: "$RELEASE_NOTES"
      # Draft until the first release is checked, then false
      draft: true
      # The plugin zip is uploaded as is, not zipped again
      zip_assets: false
      assets:
        - source_path: "release/ReSharperPlugin.RiderTestsSupportPlus-$ARTIFACT_VERSION.zip"
          label: "Rider plugin"
        - source_path: "release/ReSharperPlugin.RiderTestsSupportPlus.$ARTIFACT_VERSION.nupkg"
          label: "ReSharper plugin"
