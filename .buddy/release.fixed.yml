- pipeline: Release
  refs:
  - refs/heads/master
  actions:
  - action: Release details
    type: WAIT_FOR_VARIABLES
    variables:
    - key: BUGS
    - key: IMPROVEMENTS
    - key: INCREMENT
      defaults: |-
        Patch
        Minor
        Major
        None
    - key: NEW_FEATURES
    comment: "Version increment and changes, one per line. Fill in at least one of the changes. None: release the newest CHANGELOG.md version again (after a failed release), changes are ignored."
  - action: Validate
    type: BUILD
    commands: python3 ci/release.py check
    shell: BASH
    docker_image_name: library/python
    docker_image_tag: 3.13-slim
  - action: Update CHANGELOG.md
    type: BUILD
    commands: |-
      # Assets downloaded by an earlier run must not get into the release commit (also in .gitignore)
      rm -rf release
      # Also passes RELEASE_VERSION and RELEASE_NOTES (one line of HTML) to the next actions
      python3 ci/release.py update
    shell: BASH
    docker_image_name: library/python
    docker_image_tag: 3.13-slim
  - action: Push release commit
    type: PUSH
    trigger_conditions:
    - trigger_condition: VAR_IS_NOT
      trigger_variable_value: None
      trigger_variable_key: INCREMENT
    target_branch: master
    comment: Release $RELEASE_VERSION
    targets:
    - project_repository
  - action: Sleep 30 seconds
    type: SLEEP
    sleep_in_sec: 30
  - action: Download the artifact
    type: DOWNLOAD_ARTIFACT_VERSION
    retry_interval: 180
    retry_count: 6
    destination_path: /release
    version: $RELEASE_VERSION
    artifact: ridertestssupportplus-artifacts
  - action: Check the artifact
    type: BUILD
    commands: |-
      # Also passes ARTIFACT_VERSION (e.g. 0.3.0.57, in the file names) to the next actions
      python3 ci/release.py check-artifact
    shell: BASH
    docker_image_name: library/python
    docker_image_tag: 3.13-slim
  - action: GitHub release
    type: GIT_HUB_RELEASE
    integration: github-2
    tag_name: v$RELEASE_VERSION
    target_commitish: master
    release_name: $RELEASE_VERSION
    body: $RELEASE_NOTES
    zip_assets: false
    repository: RiderTestsSupportPlus
    organization: Lakasabasz
    assets:
    - source_path: release/ReSharperPlugin.RiderTestsSupportPlus-$ARTIFACT_VERSION.zip
      label: ReSharperPlugin.RiderTestsSupportPlus-$ARTIFACT_VERSION.zip
    - source_path: release/ReSharperPlugin.RiderTestsSupportPlus.$ARTIFACT_VERSION.nupkg
      label: ReSharperPlugin.RiderTestsSupportPlus.$ARTIFACT_VERSION.nupkg
